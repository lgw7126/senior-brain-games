<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>속담 징검다리 · 고향 가는 길</title>
<style>
:root{
  --paper:#F3EBDD; --ink:#3A2E25; --water:#9DBBB2; --water-deep:#7FA59A;
  --stone:#B7AA97; --persimmon:#C2552B; --pine:#4E6B51; --soft:#E7DCC8; --gold:#D9A02B;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{
  margin:0; min-height:100vh; background:var(--paper); color:var(--ink);
  font-family:'Gowun Batang','Noto Serif KR','Apple SD Gothic Neo','Malgun Gothic',serif;
  display:flex; flex-direction:column; align-items:center; padding:12px;
  background-image:radial-gradient(rgba(58,46,37,0.035) 1px, transparent 1px);
  background-size:22px 22px; overflow-x:hidden;
}
#app{width:100%; max-width:640px; display:flex; flex-direction:column; align-items:center;}
.top{width:100%; display:flex; justify-content:space-between; align-items:center; padding:6px 4px; flex-wrap:wrap; gap:6px;}
.brand{font-weight:700; font-size:1.15rem; letter-spacing:0.05em;}
.top-btns{display:flex; gap:8px;}
.chip{font:inherit; font-size:1rem; padding:10px 14px; border-radius:999px;
  border:2px solid var(--ink); background:var(--soft); color:var(--ink); cursor:pointer;}
.chip:focus-visible,.choice:focus-visible,.primary:focus-visible,.ghost:focus-visible{
  outline:4px solid var(--persimmon); outline-offset:2px;}
.card{width:100%; background:#FBF6EC; border:2px solid #D8CBB4; border-radius:24px;
  padding:20px 18px 26px; margin-top:8px; box-shadow:0 6px 0 #E2D6C0; position:relative; overflow:hidden;}
.center{text-align:center; display:flex; flex-direction:column; align-items:center; gap:14px;}
.h1{font-size:2rem; margin:4px 0 0; letter-spacing:0.04em;}
.sub{font-size:1.2rem; margin:0; color:#6B5A48;}
.desc{font-size:1.15rem; line-height:1.8; margin:4px 0;}
.big-emoji{font-size:2.6rem; letter-spacing:0.2em;}
.primary{font:inherit; font-size:1.4rem; font-weight:700; color:#FFF8EE;
  background:var(--persimmon); border:none; border-radius:18px; padding:18px 34px;
  cursor:pointer; min-height:64px; width:100%; max-width:380px; box-shadow:0 5px 0 #8E3B1C;}
.primary:active{transform:translateY(3px); box-shadow:0 2px 0 #8E3B1C;}
.primary.flash-btn{background:#6B5A9E; box-shadow:0 5px 0 #4A3D74;}
.primary.flash-btn:active{box-shadow:0 2px 0 #4A3D74;}
.ghost{font:inherit; font-size:1.15rem; background:none; border:2px solid var(--ink);
  border-radius:16px; padding:14px 24px; cursor:pointer; color:var(--ink);
  min-height:56px; width:100%; max-width:380px;}
.village-row{display:flex; gap:10px; font-size:1.3rem; color:#A99B85; margin-top:6px;}
.v-done{color:var(--pine);}
.stage-line{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:12px;}
.badge{background:var(--ink); color:#F7F0E2; padding:8px 14px; border-radius:999px; font-size:1rem;}
.badge.soft{background:var(--soft); color:var(--ink); border:1.5px solid #CBBDA4;}
.badge.combo{background:var(--persimmon); color:#FFF3E6; animation:pop 0.35s ease;}
.badge.goldb{background:var(--gold); color:#4A3408; animation:pop 0.35s ease;}
@keyframes pop{0%{transform:scale(0.4)} 60%{transform:scale(1.25)} 100%{transform:scale(1)}}
.stream{position:relative; height:120px; border-radius:18px; overflow:hidden;
  background:linear-gradient(var(--water), var(--water-deep));
  border:2px solid #86A096; margin-bottom:14px;}
.bank{position:absolute; bottom:6px; font-size:2rem;}
.bank-left{left:6px;} .bank-right{right:6px;}
.stone{position:absolute; bottom:18px; width:54px; height:34px; margin-left:-27px;
  background:var(--stone); border-radius:50%; border:2.5px solid #8D8170;
  box-shadow:0 4px 0 rgba(0,0,0,0.18); display:flex; align-items:center; justify-content:center;
  transition:background 0.4s;}
.stone.done{background:#CDC2AE;}
.stone.now{box-shadow:0 0 0 4px rgba(194,85,43,0.45), 0 4px 0 rgba(0,0,0,0.18);}
.stone.gold{background:linear-gradient(#F2C75C,#D9A02B); border-color:#A8771B;}
.stone.gold::after{content:"✨"; position:absolute; top:-22px; font-size:1rem; animation:twinkle 1.2s ease infinite;}
@keyframes twinkle{0%,100%{opacity:0.5; transform:scale(0.9)} 50%{opacity:1; transform:scale(1.15)}}
.mark{color:var(--pine); font-weight:700; font-size:1.1rem;}
.walker{position:absolute; bottom:22px; font-size:2.2rem;}
.walker.hop{animation:hop 0.6s ease;}
@keyframes hop{0%{transform:translateY(0)} 40%{transform:translateY(-26px)} 100%{transform:translateY(0)}}
.ripple{position:absolute; height:3px; border-radius:99px; background:rgba(255,255,255,0.45); animation:flow 6s linear infinite;}
.r1{width:60px; top:22%; left:-60px;}
.r2{width:40px; top:55%; left:-40px; animation-delay:2s;}
.r3{width:50px; top:80%; left:-50px; animation-delay:4s;}
@keyframes flow{from{transform:translateX(0)} to{transform:translateX(760px)}}
@media (prefers-reduced-motion: reduce){
  .ripple{animation:none; left:30%;} .walker.hop{animation:none;}
  .stone.gold::after{animation:none;} .badge.combo,.badge.goldb{animation:none;}
}
.q-count{text-align:center; color:#6B5A48; font-size:1.05rem; margin-bottom:4px;}
.question{font-size:1.55rem; line-height:1.7; text-align:center; font-weight:700;
  margin:6px 0 16px; min-height:2.4em;}
.choices{display:grid; grid-template-columns:1fr; gap:12px;}
@media (min-width:480px){ .choices{grid-template-columns:1fr 1fr;} }
.choice{font:inherit; font-size:1.3rem; font-weight:700; min-height:68px;
  border-radius:16px; border:2.5px solid var(--ink); background:#FFFDF7; color:var(--ink);
  cursor:pointer; padding:12px; line-height:1.4; box-shadow:0 4px 0 #D8CBB4;}
.choice:active{transform:translateY(3px); box-shadow:0 1px 0 #D8CBB4;}
.choice.wrong{background:#EAE2D3; color:#A2937D; border-color:#BBAE96; box-shadow:none; text-decoration:line-through;}
.choice.right{background:var(--pine); color:#F4F8F2; border-color:#37503B;}
.feedback{margin-top:16px; text-align:center; font-size:1.25rem; min-height:1.8em; color:#6B5A48;}
.feedback.good{color:var(--pine); font-weight:700;}
.feedback.bad{color:var(--persimmon); font-weight:700;}
.stars{font-size:1.6rem; letter-spacing:0.1em;}
.star-row{display:flex; justify-content:space-between; width:100%; max-width:320px; font-size:1.1rem; padding:3px 0; border-bottom:1px dashed #CBBDA4;}
.level-up{background:var(--soft); border:1.5px dashed #B49F7E; border-radius:14px; padding:12px 16px; font-size:1.1rem;}
.final-title{font-size:1.7rem; font-weight:700; color:var(--persimmon);
  border:2.5px solid var(--persimmon); border-radius:16px; padding:12px 28px;}
.foot{margin:14px 0 8px; color:#8C7C66; font-size:0.95rem; text-align:center;}
body.big{font-size:1.15em;}
/* 점수 풍선 */
.score-pop{position:absolute; font-weight:700; font-size:1.5rem; color:var(--pine);
  pointer-events:none; animation:rise 1s ease forwards; z-index:5;}
.score-pop.gold{color:var(--gold);}
@keyframes rise{0%{opacity:0; transform:translateY(10px) scale(0.7)}
  25%{opacity:1; transform:translateY(-6px) scale(1.2)}
  100%{opacity:0; transform:translateY(-46px) scale(1)}}
/* 폭죽 */
.confetti{position:absolute; top:-12px; width:10px; height:14px; border-radius:3px;
  animation:fall linear forwards; z-index:4; pointer-events:none;}
@keyframes fall{to{transform:translateY(560px) rotate(540deg); opacity:0.2;}}
/* 번개 모드 */
.flash-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px; flex-wrap:wrap;}
.timer{font-size:2rem; font-weight:700; background:var(--ink); color:#F7F0E2;
  border-radius:14px; padding:6px 18px; min-width:96px; text-align:center;}
.timer.hurry{background:var(--persimmon); animation:pulse 0.8s ease infinite;}
@keyframes pulse{0%,100%{transform:scale(1)} 50%{transform:scale(1.07)}}
.flash-score{font-size:1.3rem; font-weight:700;}
.combo-fire{font-size:1.2rem; font-weight:700; color:var(--persimmon); min-height:1.6em; text-align:center;}
.record{background:var(--soft); border-radius:14px; padding:10px 20px; font-size:1.15rem;}
</style>
</head>
<body class="big">
<div id="app">
  <header class="top">
    <div class="brand">속담 징검다리</div>
    <div class="top-btns">

      <button class="chip" id="soundBtn">🔔 소리 켬</button>

  <main class="card" id="main"></main>
  <footer class="foot">눈이 편안한 색으로 만들었습니다 · 속담 100가지 수록</footer>
</div>

var VILLAGES=["매화마을","개나리마을","진달래마을","민들레마을","모란마을","연꽃마을","코스모스마을","국화마을","단풍마을","소나무마을"];
var LEVEL_NAME=["아주 쉬움","쉬움","보통","어려움","고수"];
var TITLES=[[0,"속담 새싹 🌱"],[400,"속담 길손 👣"],[1000,"속담 선비 📜"],[1800,"속담 훈장 🎓"],[2600,"속담 도사 🏆"]];
var PRAISE=["참 잘하셨습니다!","역시 대단하십니다!","옳지, 바로 그겁니다!","실력이 보통이 아니십니다!","훌륭하십니다!"];
var COMBO_MSG={2:"🔥 2연속!",3:"🔥 3연속! 불붙었습니다!",4:"🔥 4연속! 멋집니다!",5:"🔥🔥 5연속! 막을 수가 없네요!",7:"🔥🔥 7연속! 동네 챔피언!",10:"🔥🔥🔥 10연속!! 전설입니다!!"};
var ENCOURAGE=["괜찮습니다, 다시 한번!","천천히 생각해 보세요","거의 다 왔습니다!"];

/* ── 상태 ── */
var S={screen:"home",mode:"journey",stage:0,qIdx:0,score:0,firstTry:0,triedWrong:[],
  feedback:null,hopping:false,soundOn:true,questions:[],stageStars:[],
  combo:0,maxCombo:0,goldenIdx:-1,qStart:0,
  flashScore:0,flashCount:0,flashTime:60,flashBest:0,flashPool:[],flashIdx:0,flashTimer:null};
var audioCtx=null;

function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function getTitle(){var t=TITLES[0][1];for(var i=0;i<TITLES.length;i++){if(S.score>=TITLES[i][0])t=TITLES[i][1];}return t;}
function clearedCount(){var n=0;for(var i=0;i<S.stageStars.length;i++){if(S.stageStars[i])n++;}return n;}

function playTone(good,combo){
  if(!S.soundOn)return;
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended")audioCtx.resume();
    var base=1+Math.min(combo||0,8)*0.06; /* 콤보가 쌓이면 음이 점점 높아짐 */
    var notes=good?[523.25*base,659.25*base,783.99*base]:[220];
    for(var i=0;i<notes.length;i++){
      var o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type="sine";o.frequency.value=notes[i];
      var t0=audioCtx.currentTime+i*0.1;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.18,t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+0.3);
      o.connect(g);g.connect(audioCtx.destination);
      o.start(t0);o.stop(t0+0.35);
    }
  }catch(e){}
}

/* ── 효과 ── */
function scorePop(text,gold){
  var m=document.getElementById("main");
  var el=document.createElement("div");
  el.className="score-pop"+(gold?" gold":"");
  el.textContent=text;
  el.style.left=(30+Math.random()*40)+"%";
  el.style.top="120px";
  m.appendChild(el);
  setTimeout(function(){el.remove();},1100);
}
function confetti(){
  var m=document.getElementById("main");
  var colors=["#C2552B","#4E6B51","#D9A02B","#6B5A9E","#9DBBB2"];
  for(var i=0;i<36;i++){
    var c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"%";
    c.style.background=colors[i%colors.length];
    c.style.animationDuration=(1.6+Math.random()*1.6)+"s";
    c.style.animationDelay=(Math.random()*0.5)+"s";
    m.appendChild(c);
    (function(el){setTimeout(function(){el.remove();},3600);})(c);
  }
}

/* ── 고향길 모드 ── */
function startStage(s){
  var tier=Math.floor(s/2);
  S.questions=shuffle(TIERS[tier]).slice(0,5).map(function(it){
    return {q:it.q,a:it.a,choices:shuffle([it.a].concat(it.d))};
  });
  S.stage=s;S.qIdx=0;S.firstTry=0;S.triedWrong=[];S.feedback=null;S.hopping=false;
  S.goldenIdx=Math.floor(Math.random()*5); /* 매번 황금 돌 하나 */
  S.mode="journey";S.screen="play";S.qStart=Date.now();
  render();
}

function onChoice(choice){
  if(S.hopping||(S.feedback&&S.feedback.type==="good"))return;
  var cur=S.questions[S.qIdx];
  if(choice===cur.a){
    var first=S.triedWrong.length===0;
    var golden=S.qIdx===S.goldenIdx;
    var fast=first&&(Date.now()-S.qStart)<6000;
    var gained=first?20:10;
    if(first){S.combo++;if(S.combo>S.maxCombo)S.maxCombo=S.combo;}else{S.combo=0;}
    var comboBonus=first&&S.combo>=2?Math.min((S.combo-1)*5,25):0;
    var speedBonus=fast?10:0;
    var total=(gained+comboBonus+speedBonus)*(golden?2:1);
    S.score+=total;
    if(first)S.firstTry++;
    playTone(true,S.combo);
    var msg=PRAISE[Math.floor(Math.random()*PRAISE.length)];
    if(COMBO_MSG[S.combo])msg=COMBO_MSG[S.combo];
    var extra=[];
    if(fast)extra.push("⚡ 빠른 답");
    if(golden)extra.push("✨ 황금 돌 2배!");
    S.feedback={type:"good",msg:msg+"  +"+total+"점"+(extra.length?"  ("+extra.join(" · ")+")":"")};
    scorePop("+"+total,golden);
    S.hopping=true;render();
    setTimeout(function(){
      S.hopping=false;S.feedback=null;S.triedWrong=[];
      if(S.qIdx+1<S.questions.length){
        S.qIdx++;S.qStart=Date.now();render();
      }else{
        var stars=S.firstTry===5?3:(S.firstTry>=3?2:1);
        S.stageStars[S.stage]=stars;
        S.screen=(S.stage===9)?"final":"clear";
        render();confetti();
      }
    },1000);
  }else{
    playTone(false,0);
    S.combo=0;
    S.triedWrong.push(choice);
    S.feedback={type:"bad",msg:ENCOURAGE[Math.floor(Math.random()*ENCOURAGE.length)]};
    render();
  }
}

/* ── 번개 모드 (60초) ── */
function startFlash(){
  var all=[];
  for(var t=0;t<TIERS.length;t++)all=all.concat(TIERS[t]);
  S.flashPool=shuffle(all).map(function(it){
    return {q:it.q,a:it.a,choices:shuffle([it.a].concat(it.d))};
  });
  S.flashIdx=0;S.flashScore=0;S.flashCount=0;S.flashTime=60;
  S.combo=0;S.maxCombo=0;S.triedWrong=[];S.feedback=null;
  S.mode="flash";S.screen="flash";
  render();
  if(S.flashTimer)clearInterval(S.flashTimer);
  S.flashTimer=setInterval(function(){
    S.flashTime--;
    var tEl=document.getElementById("timer");
    if(tEl){tEl.textContent="⏱ "+S.flashTime;if(S.flashTime<=10)tEl.classList.add("hurry");}
    if(S.flashTime<=0){
      clearInterval(S.flashTimer);S.flashTimer=null;
      if(S.flashScore>S.flashBest)S.flashBest=S.flashScore;
      S.screen="flashEnd";render();confetti();
    }
  },1000);
}

function onFlashChoice(choice){
  if(S.screen!=="flash")return;
  var cur=S.flashPool[S.flashIdx];
  if(choice===cur.a){
    S.combo++;if(S.combo>S.maxCombo)S.maxCombo=S.combo;
    var gained=10+Math.min(S.combo-1,10)*3; /* 콤보가 곧 점수! */
    S.flashScore+=gained;S.flashCount++;
    playTone(true,S.combo);
    scorePop("+"+gained,S.combo>=5);
    S.triedWrong=[];
    S.flashIdx=(S.flashIdx+1)%S.flashPool.length;
    render();
  }else{
    playTone(false,0);
    S.combo=0;
    S.triedWrong.push(choice);
    render();
  }
}

function quitFlash(){
  if(S.flashTimer){clearInterval(S.flashTimer);S.flashTimer=null;}
  S.screen="home";render();
}

/* ── 화면 그리기 ── */
function streamHTML(pos,hop){
  var h='<div class="stream" aria-hidden="true"><div class="bank bank-left">🌳</div><div class="bank bank-right">🏡</div>';
  for(var i=0;i<5;i++){
    var cls="stone"+(i<pos?" done":"")+(i===pos?" now":"")+(i===S.goldenIdx?" gold":"");
    h+='<div class="'+cls+'" style="left:'+(14+i*16)+'%">';
    if(i===pos)h+='<div class="walker'+(hop?" hop":"")+'">🧓</div>';
    if(i<pos)h+='<span class="mark">✔</span>';
    h+='</div>';
  }
  h+='<div class="ripple r1"></div><div class="ripple r2"></div><div class="ripple r3"></div></div>';
  return h;
}
function choicesHTML(cur,handler,goodLocked){
  var h='<div class="choices">';
  for(var c=0;c<cur.choices.length;c++){
    var ch=cur.choices[c];
    var wrong=S.triedWrong.indexOf(ch)>=0;
    var right=goodLocked&&ch===cur.a;
    h+='<button class="choice'+(wrong?" wrong":"")+(right?" right":"")+'"'+
       ((wrong||goodLocked)?" disabled":"")+
       ' onclick="'+handler+'(this.dataset.v)" data-v="'+esc(ch)+'">'+esc(ch)+'</button>';
  }
  return h+'</div>';
}

  var m=document.getElementById("main");
  var h="";
  if(S.screen==="home"){
    m.className="card center";
    h+='<div class="big-emoji">🪨🪨🪨</div><h1 class="h1">속담 징검다리</h1>'+
       '<p class="sub">속담 100가지 · 두 가지 놀이</p>'+
       '<p class="desc">🚶 <b>고향길</b> — 열 개 마을을 차근차근<br>⚡ <b>번개 모드</b> — 60초 동안 최대한 많이!<br>연속으로 맞히면 🔥콤보 점수가 쌓입니다</p>'+
       '<button class="primary" onclick="startStage(0)">🚶 고향길 떠나기</button>';
    if(clearedCount()>0){
      var next=Math.min(clearedCount(),9);
      h+='<button class="ghost" onclick="startStage('+next+')">이어서 하기 ('+(next+1)+'번째 마을부터)</button>';
    }
    h+='<button class="primary flash-btn" onclick="startFlash()">⚡ 번개 모드 (60초 도전)</button>';
    if(S.flashBest>0)h+='<div class="record">⚡ 오늘의 최고 기록: <b>'+S.flashBest+'점</b></div>';
    h+='<div class="village-row">';
    for(var i=0;i<10;i++){h+='<span class="'+(S.stageStars[i]?"v-done":"")+'">'+(S.stageStars[i]?"●":"○")+'</span>';}
    h+='</div>';
  }
  else if(S.screen==="play"){
    m.className="card";
    var cur=S.questions[S.qIdx];
    var pos=S.qIdx+(S.hopping?1:0);
    h+='<div class="stage-line"><span class="badge">'+(S.stage+1)+'번째 마을 · '+VILLAGES[S.stage]+'</span>'+
       '<span class="badge soft">난이도: '+LEVEL_NAME[Math.floor(S.stage/2)]+'</span>'+
       '<span class="badge soft">점수 '+S.score+'</span>'+
       (S.combo>=2?'<span class="badge combo">🔥 '+S.combo+'연속</span>':'')+
       (S.qIdx===S.goldenIdx?'<span class="badge goldb">✨ 황금 돌! 점수 2배</span>':'')+
       '</div>'+
       streamHTML(pos,S.hopping)+
       '<div class="q-count">'+(S.qIdx+1)+' / 5 번째 돌 · 6초 안에 맞히면 ⚡보너스</div>'+
       '<p class="question">'+esc(cur.q).replace(/\n/g,"<br>")+'</p>'+
       choicesHTML(cur,"onChoice",S.feedback&&S.feedback.type==="good")+
       '<div class="feedback '+(S.feedback?S.feedback.type:"")+'" role="status" aria-live="polite">'+
       (S.feedback?esc(S.feedback.msg):"알맞은 답을 골라 주세요")+'</div>';
  }
  else if(S.screen==="clear"){
    m.className="card center";
    var lvNow=Math.floor(S.stage/2),lvNext=Math.floor((S.stage+1)/2);
    h+='<div class="big-emoji">🎉</div><h1 class="h1">'+VILLAGES[S.stage]+' 도착!</h1>'+
       '<div class="stars">'+"⭐".repeat(S.stageStars[S.stage]||1)+'</div>'+
       '<p class="desc">다섯 돌 중 <b>'+S.firstTry+'개</b>를 한 번에 맞히셨습니다.<br>'+
       '최고 연속 기록 <b>🔥'+S.maxCombo+'연속</b><br>'+
       '지금까지 점수 <b>'+S.score+'점</b> · 현재 칭호 <b>'+getTitle()+'</b></p>';
    if(lvNext>lvNow&&S.stage<9){
      h+='<p class="level-up">다음 마을부터는 「'+LEVEL_NAME[lvNext]+'」 단계입니다. 힘내세요!</p>';
    }
    h+='<button class="primary" onclick="startStage('+(S.stage+1)+')">다음 마을로 🚶</button>'+
       '<button class="ghost" onclick="startStage('+S.stage+')">이 마을 다시 건너기</button>';
  }
  else if(S.screen==="final"){
    m.className="card center";
    h+='<div class="big-emoji">🏡🎊</div><h1 class="h1">고향에 도착하셨습니다!</h1>'+
       '<p class="desc">열 개 마을을 모두 건너셨습니다.<br>최종 점수 <b>'+S.score+'점</b> · 최고 <b>🔥'+S.maxCombo+'연속</b></p>'+
       '<div class="final-title">'+getTitle()+'</div><div class="stars">';
    for(var v=0;v<10;v++){
      h+='<div class="star-row"><span>'+VILLAGES[v]+'</span><span>'+"⭐".repeat(S.stageStars[v]||1)+'</span></div>';
    }
    h+='</div><button class="primary" onclick="restartAll()">처음부터 다시 걷기</button>'+
       '<button class="primary flash-btn" onclick="startFlash()">⚡ 번개 모드 도전!</button>';
  }
  else if(S.screen==="flash"){
    m.className="card";
    var fc=S.flashPool[S.flashIdx];
    h+='<div class="flash-head">'+
       '<div class="timer'+(S.flashTime<=10?" hurry":"")+'" id="timer">⏱ '+S.flashTime+'</div>'+
       '<div class="flash-score">점수 '+S.flashScore+' · 맞힌 수 '+S.flashCount+'</div>'+
       '</div>'+
       '<div class="combo-fire">'+(S.combo>=2?"🔥".repeat(Math.min(Math.floor(S.combo/2)+1,5))+" "+S.combo+"연속! 콤보 점수 상승 중!":"연속으로 맞히면 점수가 점점 커집니다")+'</div>'+
       '<p class="question">'+esc(fc.q).replace(/\n/g,"<br>")+'</p>'+
       choicesHTML(fc,"onFlashChoice",false)+
       '<div style="margin-top:18px; text-align:center;"><button class="ghost" style="max-width:240px; min-height:48px; font-size:1rem;" onclick="quitFlash()">그만하기</button></div>';
  }
  else if(S.screen==="flashEnd"){
    m.className="card center";
    var isBest=S.flashScore>=S.flashBest&&S.flashScore>0;
    h+='<div class="big-emoji">⚡🎊</div><h1 class="h1">60초 종료!</h1>'+
       (isBest?'<p class="level-up">🏅 오늘의 최고 기록 달성!</p>':'')+
       '<p class="desc"><b>'+S.flashCount+'문제</b>를 맞혀 <b>'+S.flashScore+'점</b>!<br>'+
       '최고 연속 <b>🔥'+S.maxCombo+'연속</b> · 오늘 최고 기록 <b>'+S.flashBest+'점</b></p>'+
       '<button class="primary flash-btn" onclick="startFlash()">⚡ 한 번 더! 기록 깨기</button>'+
       '<button class="ghost" onclick="quitFlash()">처음 화면으로</button>';
  }
  m.innerHTML=h;
}

function restartAll(){S.score=0;S.stageStars=[];S.maxCombo=0;startStage(0);}

document.getElementById("fontBtn").addEventListener("click",function(){
  document.body.classList.toggle("big");
  this.textContent=document.body.classList.contains("big")?"글자 보통 가":"글자 크게 가";
});
document.getElementById("soundBtn").addEventListener("click",function(){
  S.soundOn=!S.soundOn;
  this.textContent=S.soundOn?"🔔 소리 켬":"🔕 소리 끔";
});

render();
</script>
</body>
</html>
